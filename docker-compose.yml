version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: geu_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secretpassword}
      POSTGRES_DB: ${DB_NAME:-geu_waste_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api: 
    build: .
    container_name: geu_api
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}  
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db

volumes:
  pgdata: